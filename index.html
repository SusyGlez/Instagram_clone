<html>
  <head>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="top">
        <img class="page-logo" src="images/logo.png" alt="oldagram logo" />
        <a class="user-icon" href=""></a>
      </div>
      <script src="index.js"></script>
      <!-- post 1 -->
      <div class="post">
        <header alt="author information">
          <img
            class="author-photo"
            src="images/avatar-vangogh.jpg"
            alt="Profile image of Vincent van Gogh"
          />
          <div class="header-container">
            <h1>Vincent van Gogh</h1>
            <h2>Zundert, Netherlands</h2>
          </div>
        </header>
        <section>
          <img
            class="main-image-post"
            src="images/post-vangogh.jpg"
            alt="Famous self-portrait of Vincent van Gogh"
          />
        </section>
        <section>
          <div class="post-details">
            <div class="icon-btns">
              <button id="heart-icon">
                <img
                  class="icon"
                  src="images/icon-heart.png"
                  alt="Heart icon"
                />
              </button>
              <button>
                <img
                  class="icon"
                  src="images/icon-comment.png"
                  alt="Comment icon"
                />
              </button>
              <button>
                <img
                  class="icon"
                  src="images/icon-dm.png"
                  alt="DM or send icon"
                />
              </button>
            </div>
            <b class="likes-counter">21,492 likes</b>
            <p><strong>vincey1853</strong> just took a few mushrooms lol</p>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
